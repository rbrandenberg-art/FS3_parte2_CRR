spring.application.name=Usuario
server.port=8084

# Conexión a Oracle (usaremos el nombre del contenedor de docker 'oracle-db')
spring.datasource.url=jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
spring.datasource.username=USUARIO_DB
spring.datasource.password=SmartLogix123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de Hibernate para Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# 'update' creará las tablas automáticamente sin borrarlas al apagar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true